[project]
name = "agentmemorymanager"
version = "0.1.0"
description = "面向 LangChain / LangGraph 开发者的 AI Agent 三层记忆管理微服务"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "NullWinters" }
]
keywords = [
    "ai-agent",
    "memory-management",
    "langgraph",
    "langchain",
    "llm",
    "pgvector",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/NullWinters/AgentMemoryManager"
Repository = "https://github.com/NullWinters/AgentMemoryManager.git"
Issues = "https://github.com/NullWinters/AgentMemoryManager/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["static/*"]
